name: CI

# Core package only. Every job compiles the Apple speech engine (Task 7) and the
# Apple translator and readiness checks (Task 8) against the Xcode 26/27 SDKs; on
# the runners they are only smoke-tested (they conform, report pack states and
# reject a locale without assets). Microphone capture (Task 9) is iOS only: the
# iOS simulator builds compile it, and its buffer conversion and stream gate are
# unit-tested on macOS. The app skeleton (Task 11b) is built by the build-app-* jobs.
# Device-only tests (microphone, language packs,
# real recognition and translation, the self-test, airplane-mode acceptance) can
# never run here.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE: Packages/MeetingCore

jobs:
  # Unit tests (fake engines, audio-file conversion, result mapping) plus the
  # Apple engine smoke tests on the standard (free for public repos) arm64
  # macOS 26 runner. Do not switch to the *-large / *-xlarge labels: larger
  # runners are billed even in public repositories.
  test-macos-26:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test --package-path "$PACKAGE"

  # Cross-compile the package for the iOS simulator SDK of the Xcode on macos-26.
  build-ios-26:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "SDK: $SDK"
          swift build --package-path "$PACKAGE" \
            --sdk "$SDK" --triple arm64-apple-ios18.0-simulator
      - name: Build tests for iOS Simulator
        # Compiles the package's test code for iOS too (it is otherwise only built
        # on macOS). Runs nothing: the device tests need a real device.
        working-directory: Packages/MeetingCore
        run: |
          xcodebuild build-for-testing -scheme MeetingCore \
            -destination 'generic/platform=iOS Simulator'

  # The project targets iOS 27 on device. The `xcode-27` image (macOS 27, Xcode 27,
  # arm64 only) carries the iOS 27 SDK; `xcode-27-xlarge` would be billed.
  build-and-test-xcode-27:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Test
        run: swift test --package-path "$PACKAGE"
      - name: Build for iOS Simulator
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "SDK: $SDK"
          swift build --package-path "$PACKAGE" \
            --sdk "$SDK" --triple arm64-apple-ios18.0-simulator
      - name: Build tests for iOS Simulator
        # Compiles the package's test code for iOS too (it is otherwise only built
        # on macOS). Runs nothing: the device tests need a real device.
        working-directory: Packages/MeetingCore
        run: |
          xcodebuild build-for-testing -scheme MeetingCore \
            -destination 'generic/platform=iOS Simulator'

  # The app target (XcodeGen project, generated, never committed) for the iOS simulator.
  build-app-macos-26:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      # XcodeGen 2.46.0, pinned. Asset: xcodegen.zip from
      # https://github.com/yonaskolb/XcodeGen/releases/tag/2.46.0 (published
      # 2026-07-16). Expected SHA-256 is the digest GitHub shows for that release
      # asset (Releases API "digest" field); checked 2026-11-22 against a local
      # download. If this step fails on a runner, fall back to
      # `HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen` and print its version.
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          DIR="$RUNNER_TEMP/xcodegen-dist"
          mkdir -p "$DIR"
          curl -fsSL -o "$DIR/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $DIR/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$DIR/xcodegen.zip" -d "$DIR"
          chmod +x "$DIR/xcodegen/bin/xcodegen"
          echo "$DIR/xcodegen/bin" >> "$GITHUB_PATH"
          "$DIR/xcodegen/bin/xcodegen" --version
      - name: Generate project
        run: xcodegen generate
      - name: Build app for iOS Simulator
        run: |
          xcodebuild build -scheme MeetingTranslator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Build app for iOS Simulator (Release)
        run: |
          xcodebuild build -configuration Release -scheme MeetingTranslator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

  # The app target (XcodeGen project, generated, never committed) for the iOS simulator.
  build-app-xcode-27:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      # XcodeGen 2.46.0, pinned. Asset: xcodegen.zip from
      # https://github.com/yonaskolb/XcodeGen/releases/tag/2.46.0 (published
      # 2026-07-16). Expected SHA-256 is the digest GitHub shows for that release
      # asset (Releases API "digest" field); checked 2026-11-22 against a local
      # download. If this step fails on a runner, fall back to
      # `HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen` and print its version.
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          DIR="$RUNNER_TEMP/xcodegen-dist"
          mkdir -p "$DIR"
          curl -fsSL -o "$DIR/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $DIR/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$DIR/xcodegen.zip" -d "$DIR"
          chmod +x "$DIR/xcodegen/bin/xcodegen"
          echo "$DIR/xcodegen/bin" >> "$GITHUB_PATH"
          "$DIR/xcodegen/bin/xcodegen" --version
      - name: Generate project
        run: xcodegen generate
      - name: Build app for iOS Simulator
        run: |
          xcodebuild build -scheme MeetingTranslator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
